<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Sự kiện (Demo)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center text-primary mb-4">Hệ Thống Tổ Chức & Quản Lý Sự Kiện</h2>
        
        <div class="card mb-4">
            <div class="card-header bg-success text-white">Tạo Sự Kiện Mới</div>
            <div class="card-body">
                <form id="addEventForm">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label>Tên Sự Kiện</label>
                            <input type="text" id="eventName" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Ngày Tổ Chức</label>
                            <input type="date" id="eventDate" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Tổng Số Vé</label>
                            <input type="number" id="eventTickets" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Thêm Sự Kiện</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">Danh Sách Sự Kiện Đang Mở Đăng Ký</div>
            <div class="card-body">
                <table class="table table-bordered table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên Sự Kiện</th>
                            <th>Ngày Tổ Chức</th>
                            <th>Vé Đã Bán / Tổng Vé</th>
                            <th>Hành Động</th>
                        </tr>
                    </thead>
                    <tbody id="eventList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadEvents() {
            const res = await fetch('/api/events');
            const events = await res.json();
            const tbody = document.getElementById('eventList');
            tbody.innerHTML = '';
            events.forEach(ev => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${ev.id}</td>
                    <td>${ev.name}</td>
                    <td>${new Date(ev.date).toLocaleDateString('vi-VN')}</td>
                    <td><span class="badge bg-info text-dark">${ev.tickets_sold} / ${ev.total_tickets}</span></td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="bookTicket(${ev.id})" 
                            ${ev.tickets_sold >= ev.total_tickets ? 'disabled' : ''}>
                            Đăng Ký Vé
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('addEventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('eventName').value,
                date: document.getElementById('eventDate').value,
                total_tickets: parseInt(document.getElementById('eventTickets').value)
            };
            await fetch('/api/events', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            e.target.reset();
            loadEvents();
        });

        async function bookTicket(id) {
            const res = await fetch(`/api/events/${id}/book`, { method: 'POST' });
            const result = await res.json();
            if(res.ok) {
                alert("Đăng ký thành công!");
                loadEvents();
            } else {
                alert(result.error);
            }
        }

        loadEvents();
    </script>
</body>
</html>
