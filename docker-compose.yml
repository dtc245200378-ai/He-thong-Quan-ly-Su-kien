version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: event_management_system-postgres-1
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: event_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: event_management_system-pgadmin-1
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  webapp:
    image: node:18-alpine
    container_name: event_management_system-webapp-1
    working_dir: /app
    command: sh -c "npm init -y && npm install express pg && node server.js"
    volumes:
      - ./app:/app
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/event_db

  nginx:
    image: nginx:alpine
    container_name: event_management_system-nginx-1
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webapp

  prometheus:
    image: prom/prometheus:latest
    container_name: event_management_system-prometheus-1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: event_management_system-grafana-1
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:2.9.0
    container_name: event_management_system-loki-1
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    command: -config.file=/etc/loki/loki-config.yaml

  promtail:
    image: grafana/promtail:2.9.0
    container_name: event_management_system-promtail-1
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yaml

volumes:
  pgdata:
